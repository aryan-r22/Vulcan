const { ApolloServer, gql } = require('apollo-server');
const typeDefs = gql`
  # This "Project" type defines the queryable fields: 'name', 'loaction', 'social-media','website', 'sectors' and 'address[eth]'.
  type Project {
    name: String
    location: String
    social-media: String
    website: String
    sectors: String
    address[eth]: String
  }
  # the "projects" query returns an array of zero or more projects
  # the "projectByCID" query returns Project by cid
  type Query {
    projects:[Project]
    projectByCID(id:ID!):Project 
  }
`;
